onboarding = false

[keys]
prefix = "ctrl+b"

# pane navigation
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# tab, pane, workspace
new_tab = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
split_vertical = "prefix+v"
split_horizontal = "prefix+minus"
goto = "prefix+g"

# copy mode
copy_mode = "prefix+y"

[[keys.command]]
key = "prefix+l"
type = "popup"
command = "lazygit --use-config-file ~/.config/lazygit/config.yml" # add --use-config-file because somehow
                                                                   # herdr popup pane doesn't pick up $XDG_CONFIG_HOME
                                                                   # so lazygit doesn't automatically pick up config file
description = "run lazygit"
width = "93%"
height = "93%"

[ui.sound]
enabled = true

[ui]
show_agent_labels_on_pane_borders = true

[theme]
name = "rose-pine"
auto_switch = false
